name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag to publish, for example v0.1.0"
        required: true
        type: string
      release_name:
        description: "Release title. Defaults to Setsuna Desktop <tag>."
        required: false
        type: string
      draft:
        description: "Create a draft release when the release does not exist."
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the release as a prerelease when the release does not exist."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  # Hosted runners download directly from Electron instead of the local China mirror.
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release version
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate package version and tag
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: node scripts/validate-release-version.mjs

  quality-gate:
    name: Static and unit quality gate
    needs: validate-release
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure node-gyp Python
        run: node scripts/configure-node-gyp-python.mjs

      - name: Install
        env:
          RUN_WITH_LOG_HEARTBEAT_SECONDS: "30"
          RUN_WITH_LOG_TIMEOUT_MINUTES: "15"
        run: node scripts/run-with-log.mjs release-logs/install-quality.log pnpm install --frozen-lockfile

      - name: Typecheck
        env:
          RUN_WITH_LOG_HEARTBEAT_SECONDS: "30"
          RUN_WITH_LOG_TIMEOUT_MINUTES: "15"
        run: node scripts/run-with-log.mjs release-logs/typecheck-quality.log pnpm typecheck

      - name: Unit tests
        env:
          RUN_WITH_LOG_HEARTBEAT_SECONDS: "30"
          RUN_WITH_LOG_TIMEOUT_MINUTES: "20"
        run: node scripts/run-with-log.mjs release-logs/test-unit.log pnpm test:unit

  integration-diagnostics:
    name: Integration diagnostics
    needs: validate-release
    runs-on: macos-15
    timeout-minutes: 35
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure node-gyp Python
        run: node scripts/configure-node-gyp-python.mjs

      - name: Install
        env:
          RUN_WITH_LOG_HEARTBEAT_SECONDS: "30"
          RUN_WITH_LOG_TIMEOUT_MINUTES: "15"
        run: node scripts/run-with-log.mjs release-logs/install-integration.log pnpm install --frozen-lockfile

      - name: Integration tests
        env:
          RUN_WITH_LOG_HEARTBEAT_SECONDS: "30"
          RUN_WITH_LOG_TIMEOUT_MINUTES: "25"
        run: |
          pnpm build:contracts
          node scripts/run-with-log.mjs release-logs/test-integration.log pnpm test:integration

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-integration-logs
          path: release-logs
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package ${{ matrix.label }}
    needs: [validate-release, quality-gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            artifact: macos-arm64
            os: macos-15
            package_script: package:mac:arm64
          - label: macOS Intel
            artifact: macos-x64
            os: macos-15-intel
            package_script: package:mac:x64
          - label: Windows x64
            artifact: windows-x64
            os: windows-2025
            package_script: package:win:x64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure node-gyp Python
        run: node scripts/configure-node-gyp-python.mjs

      - name: Show runner architecture
        run: node scripts/show-runner-architecture.mjs

      - name: Install Windows sandbox Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install
        env:
          RUN_WITH_LOG_HEARTBEAT_SECONDS: "30"
          RUN_WITH_LOG_TIMEOUT_MINUTES: "20"
        run: node scripts/run-with-log.mjs release-logs/install-${{ matrix.artifact }}.log pnpm install --frozen-lockfile

      - name: Release gate tests
        env:
          RUN_WITH_LOG_HEARTBEAT_SECONDS: "30"
          RUN_WITH_LOG_TIMEOUT_MINUTES: "15"
        run: node scripts/run-with-log.mjs release-logs/test-${{ matrix.artifact }}.log pnpm test:release

      - name: Package and notarize macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUN_WITH_LOG_HEARTBEAT_SECONDS: "30"
          RUN_WITH_LOG_TIMEOUT_MINUTES: "60"
        run: |
          set -euo pipefail
          # electron-builder can silently skip notarization when credentials are absent.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Actions secret: ${name}"
              exit 1
            fi
          done
          node scripts/run-with-log.mjs release-logs/package-${{ matrix.artifact }}.log pnpm ${{ matrix.package_script }} --config.mac.forceCodeSigning=true

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for app in release-artifacts/mac*/"Setsuna Desktop.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done

      - name: Package Windows app
        if: runner.os == 'Windows'
        env:
          RUN_WITH_LOG_HEARTBEAT_SECONDS: "30"
          RUN_WITH_LOG_TIMEOUT_MINUTES: "35"
        run: node scripts/run-with-log.mjs release-logs/package-${{ matrix.artifact }}.log pnpm ${{ matrix.package_script }}

      - name: Collect package outputs
        run: node scripts/collect-release-job-assets.mjs ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: release-upload/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-logs-${{ matrix.artifact }}
          path: release-logs
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts/downloaded
          merge-multiple: false

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: node scripts/prepare-github-release-assets.mjs release-artifacts/downloaded release-artifacts/upload

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_NAME_INPUT: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          release_name="${RELEASE_NAME_INPUT:-Setsuna Desktop ${RELEASE_TAG}}"
          cat > release-notes.md <<EOF
          ${release_name}

          Assets generated by GitHub Actions:
          - macOS Apple Silicon: DMG installer and ZIP for automatic updates, containing a Developer ID signed and notarized app.
          - macOS Intel: DMG installer and ZIP for automatic updates, containing a Developer ID signed and notarized app.
          - Windows x64: NSIS installer.

          SHA256SUMS contains installer and update archive checksums. Linux is no longer supported.
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_NAME_INPUT: ${{ inputs.release_name }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          release_name="${RELEASE_NAME_INPUT:-Setsuna Desktop ${RELEASE_TAG}}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$release_name" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-artifacts/upload/* --clobber
            # Re-running an existing tag also removes obsolete generated assets.
            # Only prune known build outputs after the new installers are uploaded.
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > release-existing-assets.txt
            while IFS= read -r asset; do
              case "$asset" in
                release-manifest.json|"build-logs-${RELEASE_TAG}.zip"|latest.yml|latest.yaml|\
                latest-mac.yml|latest-mac.yaml|latest-linux.yml|latest-linux.yaml|\
                latest-mac-arm64.yml|latest-mac-x64.yml|latest-mac-arm64.yaml|latest-mac-x64.yaml|\
                "Setsuna-Desktop-${RELEASE_TAG#v}-windows-"*.zip|\
                "Setsuna-Desktop-${RELEASE_TAG#v}-ubuntu-"*|\
                "Setsuna-Desktop-${RELEASE_TAG#v}-"*.blockmap)
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                  ;;
              esac
            done < release-existing-assets.txt
          else
            flags=(--target "$GITHUB_SHA" --title "$release_name" --notes-file release-notes.md)
            if [[ "$DRAFT" == "true" ]]; then
              flags+=(--draft)
            fi
            if [[ "$PRERELEASE" == "true" ]]; then
              flags+=(--prerelease)
            fi

            gh release create "$RELEASE_TAG" release-artifacts/upload/* "${flags[@]}"
          fi
