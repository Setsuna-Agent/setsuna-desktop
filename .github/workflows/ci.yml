name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CI / typecheck, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure node-gyp Python
        run: node scripts/configure-node-gyp-python.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  windows-sandbox:
    name: CI / Windows native sandbox
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target and components
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup component add clippy rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path native/windows-sandbox/Cargo.toml -- --check

      - name: Lint Windows sidecar
        run: cargo clippy --locked --manifest-path native/windows-sandbox/Cargo.toml --target x86_64-pc-windows-msvc -- -D warnings

      - name: Test Windows sidecar
        run: cargo test --locked --manifest-path native/windows-sandbox/Cargo.toml

      - name: Smoke-test Windows executable protocol
        shell: pwsh
        run: |
          $result = cargo run --quiet --locked --manifest-path native/windows-sandbox/Cargo.toml --target x86_64-pc-windows-msvc -- version | Select-Object -Last 1 | ConvertFrom-Json
          if (-not $result.ok -or -not $result.version) {
            throw "Windows sandbox version protocol failed"
          }

      - name: Exercise Windows accounts, ACLs, firewall, and restricted process
        shell: pwsh
        run: |
          $binary = (Resolve-Path "native/windows-sandbox/target/x86_64-pc-windows-msvc/debug/setsuna-sandbox-win.exe").Path
          $ownerSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & $binary install-elevated --owner-sid $ownerSid
          if ($LASTEXITCODE -ne 0) { throw "Windows sandbox installation smoke test failed" }

          $status = & $binary status | Select-Object -Last 1 | ConvertFrom-Json
          if (-not $status.ok -or $status.status.state -ne "ready") {
            throw "Windows sandbox did not report ready after installation"
          }

          $root = Join-Path $env:RUNNER_TEMP "setsuna-sandbox-smoke"
          $workspace = Join-Path $root "workspace"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $requestPath = Join-Path $root "request.json"
          $request = @{
            protocolVersion = 1
            executionId = "windows_ci_smoke"
            supervisorPids = @($PID)
            command = "echo sandbox-ok>result.txt"
            cwd = $workspace
            workspaceRoot = $workspace
            permissionProfile = "workspace-write"
            readableRoots = @($workspace)
            writableRoots = @($workspace)
            ephemeralWritableRoots = @()
            deniedRoots = @()
            deniedGlobRegExpSources = @()
            protectedWritableRoots = @()
            networkAccess = $false
            environment = @{
              ComSpec = $env:ComSpec
              PATH = $env:PATH
              SystemRoot = $env:SystemRoot
              TEMP = $workspace
              TMP = $workspace
            }
          }
          $request | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $requestPath

          & $binary run --request $requestPath
          if ($LASTEXITCODE -ne 0) { throw "Restricted Windows sandbox command failed" }
          if (Test-Path $requestPath) {
            throw "Sandbox request containing relay credentials was not destroyed"
          }
          if ((Get-Content (Join-Path $workspace "result.txt") -Raw).Trim() -ne "sandbox-ok") {
            throw "Restricted Windows sandbox command produced an unexpected result"
          }
          $workspaceAceCount = (Get-Acl $workspace).Access.Count

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          try {
            $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
            @'
          param([int]$Port)
          $client = [System.Net.Sockets.TcpClient]::new()
          try {
            if ($client.ConnectAsync('127.0.0.1', $Port).Wait(2000)) { exit 9 }
          } catch {}
          exit 0
          '@ | Set-Content -Encoding utf8 (Join-Path $workspace "offline-check.ps1")
            $offlineRequest = $request.Clone()
            $offlineRequest.executionId = "windows_ci_offline"
            $offlineRequest.command = "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File offline-check.ps1 $port"
            $offlineRequest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $requestPath
            & $binary run --request $requestPath
            if ($LASTEXITCODE -ne 0) {
              throw "Offline Windows sandbox reached a blocked host loopback port"
            }
            if (Test-Path $requestPath) {
              throw "Second sandbox request was not destroyed"
            }
            if ((Get-Acl $workspace).Access.Count -ne $workspaceAceCount) {
              throw "Per-logon sandbox ACL entries accumulated after command exit"
            }
          } finally {
            $listener.Stop()
          }

      - name: Remove Windows sandbox smoke-test identities
        if: always()
        shell: pwsh
        run: |
          $binary = "native/windows-sandbox/target/x86_64-pc-windows-msvc/debug/setsuna-sandbox-win.exe"
          if (Test-Path $binary) {
            & $binary uninstall-elevated
            if ($LASTEXITCODE -ne 0) { throw "Windows sandbox cleanup failed" }
          }
