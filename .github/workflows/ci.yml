name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-sandbox:
    name: CI / Windows encoding diagnostics
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Verify command handoff after UTF-8 initialization
        shell: pwsh
        run: |
          $cases = @(
            @{ name = 'chinese'; command = '(echo 中文输出) & (echo 中文错误 1>&2) & exit /b 23' },
            @{ name = 'quoted'; command = 'echo "one & two" & (echo 中文输出) & exit /b 23' },
            @{ name = 'percent'; command = 'echo %SETSUNA_TEST_VALUE% & exit /b 23' },
            @{ name = 'exclamation'; command = 'echo !SETSUNA_TEST_OTHER! & echo caret ^^ end ^& literal & exit /b 23' },
            @{ name = 'pipe'; command = '(echo 中文输出) | findstr . & exit /b 23' },
            @{ name = 'for'; command = 'for %I in (one two) do @echo %I' },
            @{ name = 'executable'; command = '"C:\Windows\System32\cmd.exe" /d /c echo 嵌套中文' }
          )
          foreach ($case in $cases) {
            $start = [System.Diagnostics.ProcessStartInfo]::new()
            $start.FileName = "$env:SystemRoot\System32\cmd.exe"
            $start.Arguments = '/d /v:on /s /c "chcp 65001 >nul && "' + $start.FileName + '" /d /s /c !SETSUNA_SHELL_COMMAND!"'
            $start.Environment['SETSUNA_SHELL_COMMAND'] = '"' + $case.command + '"'
            $start.Environment['SETSUNA_TEST_VALUE'] = '%SETSUNA_TEST_OTHER%'
            $start.Environment['SETSUNA_TEST_OTHER'] = 'unexpected-expansion'
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.RedirectStandardInput = $true
            $start.StandardOutputEncoding = [System.Text.UTF8Encoding]::new($false)
            $start.StandardErrorEncoding = [System.Text.UTF8Encoding]::new($false)
            $process = [System.Diagnostics.Process]::Start($start)
            $process.StandardInput.Close()
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(10000)) { $process.Kill($true); throw "Probe timed out" }
            @{ name = $case.name; exit = $process.ExitCode; stdout = $stdout.GetAwaiter().GetResult(); stderr = $stderr.GetAwaiter().GetResult() } | ConvertTo-Json -Compress
            $process.Dispose()
          }
