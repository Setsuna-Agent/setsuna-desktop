name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-sandbox:
    name: CI / Windows encoding diagnostics
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Compare console encoding initialization
        shell: pwsh
        run: |
          $cases = @(
            @{ name = 'same-line'; command = 'chcp 65001 >nul && (echo 中文输出) && (echo 中文错误 1>&2) & exit /b 23' },
            @{ name = 'new-line'; command = "chcp 65001 >nul`r`n(echo 中文输出)`r`n(echo 中文错误 1>&2)`r`nexit /b 23" },
            @{ name = 'nested'; command = 'chcp 65001 >nul && cmd.exe /d /s /c "(echo 中文输出) && (echo 中文错误 1>&2) & exit /b 23"' },
            @{ name = 'nested-quoted'; command = 'chcp 65001 >nul && cmd.exe /d /s /c "echo "one & two" & (echo 中文输出) & exit /b 23"' },
            @{ name = 'nested-caret'; command = 'chcp 65001 >nul && cmd.exe /d /s /c ^"echo ^"one ^& two^" ^& ^(echo 中文输出^) ^& exit /b 23^"' }
          )
          foreach ($case in $cases) {
            $start = [System.Diagnostics.ProcessStartInfo]::new()
            $start.FileName = "$env:SystemRoot\System32\cmd.exe"
            $start.Arguments = '/d /s /c "' + $case.command + '"'
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.RedirectStandardInput = $true
            $start.StandardOutputEncoding = [System.Text.UTF8Encoding]::new($false)
            $start.StandardErrorEncoding = [System.Text.UTF8Encoding]::new($false)
            $process = [System.Diagnostics.Process]::Start($start)
            $process.StandardInput.Close()
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(10000)) { $process.Kill($true); throw "Probe timed out" }
            @{ name = $case.name; exit = $process.ExitCode; stdout = $stdout.GetAwaiter().GetResult(); stderr = $stderr.GetAwaiter().GetResult() } | ConvertTo-Json -Compress
            $process.Dispose()
          }
