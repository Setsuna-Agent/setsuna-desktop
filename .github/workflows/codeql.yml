name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languages:
    name: Select CodeQL languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        uses: actions/github-script@v8
        with:
          script: |
            const languages = ['actions', 'javascript-typescript', 'python', 'rust'];
            let scanSwift = true;
            if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: context.issue.number, per_page: 100,
              });
              const buildPaths = new Set([
                'scripts/build-computer-use-mac.mjs', 'package.json', '.github/workflows/codeql.yml',
              ]);
              const affectsSwift = (filename) => filename?.endsWith('.swift') || buildPaths.has(filename);
              // The files API is capped at 3,000 entries; scan if the list may be incomplete.
              scanSwift = files.length >= 3000 || files.some((file) =>
                affectsSwift(file.filename) || affectsSwift(file.previous_filename));
            }
            if (scanSwift) languages.push('swift');
            core.setOutput('matrix', JSON.stringify({ include: languages.map((language) => ({
              language, 'build-mode': language === 'swift' ? 'manual' : 'none',
            })) }));

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    runs-on: ${{ matrix.language == 'swift' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: matrix.language == 'swift'
        with:
          version: 7.33.7

      - uses: actions/setup-node@v4
        if: matrix.language == 'swift'
        with:
          node-version: 22

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The Swift helper uses swiftc directly; there is no Xcode or SwiftPM project for autobuild.
      # This script only needs Node built-ins, so no dependency installation or build cache is needed.
      - name: Build macOS computer helper
        if: matrix.language == 'swift'
        run: pnpm build:computer-use:mac

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
