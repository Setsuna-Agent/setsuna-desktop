[package]
name = "setsuna-computer-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[[bin]]
name = "setsuna-computer-win"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
windows-sys = { version = "0.52", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_System_IO", "Win32_System_Pipes",
  "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
